---
# Source: hw11/templates/deployment.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: api
data:
  MAX_PARALLEL: "1"
  MAX_WAITING: "12"
  QUEUE_TIMEOUT_SECONDS: "3"
  CACHE_SIZE: "8"
  CACHE_HIT_MS: "8"
  CACHE_MISS_MS: "60"
---
# Source: hw11/templates/services.yaml
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: hw11-api
  ports:
    - name: http
      port: 8091
      targetPort: http
  sessionAffinity: None
---
# Source: hw11/templates/services.yaml
apiVersion: v1
kind: Service
metadata:
  name: api-sticky
spec:
  selector:
    app: hw11-api
  ports:
    - name: http
      port: 8091
      targetPort: http
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
# Source: hw11/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  progressDeadlineSeconds: 220
  minReadySeconds: 2
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hw11-api
  template:
    metadata:
      labels:
        app: hw11-api
      annotations:
        config.sha256: "024671473ad54698cfe3bc3fc048110c2f3153b2993940b1e43d96951d633239"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
        - name: api
          image: "hw11-api:1.0.0"
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8091
          envFrom:
            - configMapRef:
                name: api
          env:
            - name: MODEL_VERSION
              value: "A"
            - name: WARMUP_SECONDS
              value: "20"
            - name: FAIL_LOAD
              value: "false"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          startupProbe:
            httpGet:
              path: /startup
              port: http
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 45
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["python", "-c", "import time; time.sleep(3)"]
          resources:
            limits:
              cpu: 850m
              ephemeral-storage: 128Mi
              memory: 192Mi
            requests:
              cpu: 200m
              ephemeral-storage: 32Mi
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
