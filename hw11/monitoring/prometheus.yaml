global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yaml
scrape_configs:
  - job_name: kube-state-metrics
    static_configs:
      - targets: [kube-state-metrics:8080]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: kube_pod_status_ready
        action: keep
  - job_name: api
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [hw11]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_container_port_name]
        regex: hw11-api;http
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
  - job_name: cadvisor
    scheme: https
    kubernetes_sd_configs:
      - role: node
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
    metric_relabel_configs:
      - source_labels: [__name__, namespace, container]
        regex: "container_cpu_usage_seconds_total;hw11;api|container_memory_working_set_bytes;hw11;api"
        action: keep
