groups:
  - name: inference
    interval: 5s
    rules:
      - alert: InferenceHighTTFC
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(api_ttfc_seconds_bucket[30s]))) > 0.65
          and sum(increase(api_ttfc_seconds_count[30s])) >= 10
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "p95 TTFC above 650 ms"
      - alert: InferenceRejectedRequests
        expr: |
          sum(rate(api_requests_total{outcome="rejected"}[30s]))
          / sum(rate(api_requests_total[30s])) > 0.10
          and sum(increase(api_requests_total[30s])) >= 10
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "More than 10% of terminal requests were rejected"
