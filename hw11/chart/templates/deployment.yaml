apiVersion: v1
kind: ConfigMap
metadata:
  name: api
data:
  MAX_PARALLEL: {{ .Values.maxParallel | quote }}
  MAX_WAITING: {{ .Values.maxWaiting | quote }}
  QUEUE_TIMEOUT_SECONDS: {{ .Values.queueTimeoutSeconds | quote }}
  CACHE_SIZE: {{ .Values.cacheSize | quote }}
  CACHE_HIT_MS: {{ .Values.cacheHitMs | quote }}
  CACHE_MISS_MS: {{ .Values.cacheMissMs | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  progressDeadlineSeconds: 220
  minReadySeconds: 2
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hw11-api
  template:
    metadata:
      labels:
        app: hw11-api
      annotations:
        config.sha256: {{ toJson (omit .Values "hpa" "replicas") | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
        - name: api
          image: {{ .Values.image | quote }}
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8091
          envFrom:
            - configMapRef:
                name: api
          env:
            - name: MODEL_VERSION
              value: {{ .Values.modelVersion | quote }}
            - name: WARMUP_SECONDS
              value: {{ .Values.warmupSeconds | quote }}
            - name: FAIL_LOAD
              value: {{ .Values.failLoad | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          startupProbe:
            httpGet:
              path: {{ ternary "/health" "/startup" .Values.earlyProbes }}
              port: http
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: {{ max 45 (add (ceil .Values.warmupSeconds | int) 15) }}
          readinessProbe:
            httpGet:
              path: {{ ternary "/health" "/ready" .Values.earlyProbes }}
              port: http
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["python", "-c", "import time; time.sleep(3)"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
