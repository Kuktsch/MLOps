apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: hw11-api
  ports:
    - name: http
      port: 8091
      targetPort: http
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: api-sticky
spec:
  selector:
    app: hw11-api
  ports:
    - name: http
      port: 8091
      targetPort: http
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
