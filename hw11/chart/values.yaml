    cpu: 200m
    memory: 96Mi
    ephemeral-storage: 32Mi
  limits:
    cpu: 850m
    memory: 192Mi
    ephemeral-storage: 128Mi
hpa:
  enabled: false
  min: 2
  max: 3
  targetCPU: 65
  downWindowSeconds: 45
