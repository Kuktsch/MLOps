image: hw11-api:1.0.0
replicas: 2
modelVersion: A
failLoad: false
warmupSeconds: 20
earlyProbes: false
maxParallel: 1
maxWaiting: 12
queueTimeoutSeconds: 3
cacheSize: 8
cacheHitMs: 8
cacheMissMs: 60
resources:
