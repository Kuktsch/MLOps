# Единственное место, где живёт конфигурация препроцессинга.
# Правится ЗДЕСЬ, а не в коде: в src/ не должно быть ни имени модели,
# ни длин, ни порогов.
model:
  name: "Qwen/Qwen3-0.6B"
  # Qwen3 без этого флага ждёт от модели <think>-блок, и тогда шаблон
  # инференса перестаёт быть префиксом шаблона обучения. См. docs/tokenize_report.md.
  enable_thinking: false

data:
  # Вход — свои split-артефакты HW3 v2 (3345 train, 418 val до токенизации).
  # make sample предназначен только для учебного parquet преподавателя.
  source_train: "../../datasets/nmo/sft_single/train/0000.parquet"
  source_val: "../../datasets/nmo/sft_single/validation/0000.parquet"
  train_jsonl: "data/train.jsonl"
  val_jsonl: "data/val.jsonl"
  out_dir: "data/tokenized"

sample:
  train_size: 500
  val_size: 100
  scan_rows: 20000          # сколько строк parquet просматриваем перед выборкой
  seed: 42

tokenize:
  # По реальным длинам HW3 v2: p99 train=267, max train=296, max val=320.
  # 384 — первый кандидат калибратора, при котором оба сплита укладываются без обрезки.
  max_seq_len: 384
  truncated_warn_ratio: 0.05
  padding_side: "left"

packing:
  # Packing в ДЗ 4 опционален. Отключён: без блочно-диагональной attention mask
  # соседние примеры видят друг друга, что меняет задачу обучения.
  enabled: false
  batch_size: 8

train_estimate:
  epochs: 3
  # Медианная скорость ГЕНЕРАЦИИ Qwen3-0.6B из ДЗ 1 на RTX 3060 Ti.
  # По условию ДЗ 4 обучение ожидается медленнее генерации в 2–3 раза.
  tokens_per_sec: 26.6
  training_slowdown_min: 2.0
  training_slowdown_max: 3.0
